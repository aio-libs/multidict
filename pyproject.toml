[build-system]
requires = [
  # setuptools >= 77.0 required for PEP 639 SPDX license metadata
  # (it also covers the >= 67.0 floor needed for Python 3.12+ support,
  # and the >= 61.0 one for reading `[project]` from this file).
  "setuptools >= 77.0",
]
build-backend = "setuptools.build_meta"


[project]
name = "multidict"
description = "multidict implementation"
authors = [{ name = "Andrew Svetlov", email = "andrew.svetlov@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">= 3.10"
classifiers = [
  "Development Status :: 5 - Production/Stable",

  "Intended Audience :: Developers",

  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "typing-extensions >= 4.1.0; python_version < '3.11'",
]
dynamic = ["version", "readme"]

[project.urls]
"Homepage" = "https://github.com/aio-libs/multidict"
"Chat: Matrix" = "https://matrix.to/#/#aio-libs:matrix.org"
"Chat: Matrix Space" = "https://matrix.to/#/#aio-libs-space:matrix.org"
"CI: GitHub" = "https://github.com/aio-libs/multidict/actions"
"Code of Conduct" = "https://github.com/aio-libs/.github/blob/master/CODE_OF_CONDUCT.md"
"Coverage: codecov" = "https://codecov.io/github/aio-libs/multidict"
"Docs: Changelog" = "https://multidict.aio-libs.org/en/latest/changes/"
"Docs: RTD" = "https://multidict.aio-libs.org"
"GitHub: issues" = "https://github.com/aio-libs/multidict/issues"
"GitHub: repo" = "https://github.com/aio-libs/multidict"


[tool.setuptools]
packages = ["multidict"]
# setuptools defaults this to true for a `[project]`-configured build,
# unlike the `setup.cfg` default it replaces. Left on, every file
# `MANIFEST.in` pulls into the sdist also lands in the wheel, including
# the internal `_multilib/*.h` headers and the C sources. Only the
# `package-data` entries below belong in a wheel.
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "multidict.__version__" }
readme = { file = "README.rst", content-type = "text/x-rst" }

[tool.setuptools.package-data]
# Ship just the public capsule headers in wheels, not the internal
# _multilib/*.h ones: third-party C extensions build against these two.
# __init__.pxd is the Cython equivalent, letting third-party Cython code
# `cimport multidict`.
multidict = [
  "multidict_capi.h",
  "multidict_capi_struct.h",
  "__init__.pxd",
]


[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Keep this list small and intentional. Each entry is enforced
# repo-wide; do not enable additional lint groups as a drive-by.
select = [
  # Import sorting. Replaces a dedicated isort hook so the formatter
  # (ruff format) and the import sorter (ruff check --select I) come
  # from the same tool and rev.
  "I",
  # Imports must live at the top of the module. Late/inside-function
  # imports must be opted into explicitly with `# noqa: PLC0415` and a
  # comment explaining why (e.g. avoiding a heavy optional dependency
  # in the import path). Enforced because AI-assisted contributions
  # frequently introduce function-scoped imports that are unnecessary.
  "PLC0415",
  # pyupgrade: enforce modern Python syntax for the current
  # ``target-version`` (currently py310).
  "UP",
]

[tool.cibuildwheel]
# `build[uv]` makes cibuildwheel use `uv` for every venv it provisions,
# both on the build side (passed to `python -m build` as `--installer=uv`)
# and when materializing the test environment. uv resolves and installs
# the wheel plus `requirements/pytest.txt` in roughly a second; the previous
# pip-based path took noticeably longer per ABI and ran once per matrix
# cell.
build-frontend = "build[uv]"
test-requires = "-r requirements/pytest.txt"
test-command = 'pytest -m "not leaks and not hypothesis and not capi" --no-cov {project}/tests'

[tool.cibuildwheel.ios]
# uv does not support building for iOS; fall back to the plain `build`
# frontend for this platform.
build-frontend = "build"

[tool.cibuildwheel.linux]
# Re-enable 32-bit builds (disabled by default in cibuildwheel 3.0)
archs = ["auto", "auto32"]
before-all = "yum install -y libffi-devel || apk add --upgrade libffi-dev || apt-get install libffi-dev"
